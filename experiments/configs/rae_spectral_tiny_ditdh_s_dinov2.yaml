stage_1:
  target: stage1.RAE
  params:
    encoder_cls: Dinov2withNorm
    encoder_config_path: facebook/dinov2-with-registers-base
    encoder_input_size: 224
    encoder_params:
      dinov2_path: facebook/dinov2-with-registers-base
      normalize: true
    decoder_config_path: configs/decoder/ViTXL
    pretrained_decoder_path: models/decoders/dinov2/wReg_base/ViTXL_n08/model.pt
    noise_tau: 0.0
    reshape_to_2d: true
    normalization_stat_path: models/stats/dinov2/wReg_base/imagenet1k/stat.pt

stage_2:
  target: stage2.models.DDT.DiTwDDTHead
  params:
    input_size: 16
    patch_size: 1
    in_channels: 768
    hidden_size: [384, 2048]
    depth: [12, 2]
    num_heads: [6, 16]
    mlp_ratio: 4.0
    class_dropout_prob: 0.1
    num_classes: 1000
    use_qknorm: false
    use_swiglu: true
    use_rope: true
    use_rmsnorm: true
    wo_shift: false
    use_pos_embed: true

transport:
  params:
    path_type: Linear
    prediction: velocity
    loss_weight: null
    time_dist_type: logit-normal_0_1

sampler:
  mode: ODE
  params:
    sampling_method: euler
    num_steps: 50
    atol: 1.0e-6
    rtol: 1.0e-3
    reverse: false

guidance:
  method: cfg
  scale: 1.0
  t_min: 0.0
  t_max: 1.0

misc:
  latent_size: [768, 16, 16]
  num_classes: 1000
  time_dist_shift_dim: 196608
  time_dist_shift_base: 4096

training:
  epochs: 1400
  global_batch_size: 16
  # One free 4090 uses micro-batch 8 x accumulation 2. On four free GPUs,
  # set this to 1 to retain the same global batch size.
  grad_accum_steps: 2
  ema_decay: 0.9995
  num_workers: 4
  log_interval: 10
  checkpoint_interval: 1
  checkpoint_steps: 500
  sample_every: 0
  max_train_steps: 10000
  clip_grad: 1.0
  global_seed: 42
  deterministic: true
  shuffle_data: true
  optimizer:
    # Match the full-state step-0 checkpoint used by every paired branch.
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    type: linear
    warmup_steps: 500
    decay_end_steps: 100000
    base_lr: 2.0e-4
    final_lr: 2.0e-5
    warmup_from_zero: false
  spectral_direction_loss:
    enabled: true
    # Baseline and treatment both use this path. Override with
    # --spectral-gamma 0 or --spectral-gamma 0.5.
    gamma: 0.0
    spatial_size: 16
    damping: 1.0e-4
    min_weight: 0.2
    max_weight: 2.0
    # Fixed before microtraining from 2,048 ImageNet-1k train latents only.
    # Equal-cardinality radial DCT bands, low to high spatial frequency.
    second_moments:
      - 8.028002738952637
      - 0.6730865240097046
      - 0.4063557982444763
      - 0.3170098662376404
      - 0.27100059390068054
      - 0.2494099885225296
      - 0.2303747683763504
      - 0.20873603224754333
    stats_source: /home/zhoushunyu/data/eqvae/cache/gauge_large/rae_dinov2_imagenet_2048_512.pt

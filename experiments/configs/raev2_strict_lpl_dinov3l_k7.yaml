stage_1:
  target: stage1.RAE
  params:
    encoder_name: dinov3mls-vit-l16[layers=11.13.15.17.19.21.23]
    resolution: 256
    decoder_config_path: /home/zhoushunyu/eqvae/external/RAEv2/configs/decoder/ViTXL
    pretrained_decoder_path: /home/zhoushunyu/data/eqvae/models/RAEv2/stage1/imagenet/dinov3l-k7/decoder.pt
    noise_tau: 0.0
    normalization_stat_path: /home/zhoushunyu/data/eqvae/models/RAEv2/stage1/imagenet/dinov3l-k7/stats.pt
stage_2:
  target: stage2.models.DDT.DiTwDDTHeadIG
  params:
    input_size: 16
    patch_size: [1, 1]
    in_channels: 1024
    hidden_size: [1440, 2048]
    depth: [28, 2]
    num_heads: [20, 16]
    mlp_ratio: 4.0
    base_model_depth: 8
conditioning:
  type: label
  cfg_dropout_prob: 0.1
  arch:
    num_t_tokens: 4
    num_c_tokens: 8
transport:
  prediction: x
  time_dist_type: logit-normal_0_1
sampler:
  num_steps: 100
guidance:
  cfg:
    scale: 1.0
    t_min: 0.0
    t_max: 1.0
  ig:
    scale: 1.78
    t_min: 0.10
    t_max: 1.0
dataset:
  target: imagenet
  type: hf
  data_dir: /data/shared/imagenet-1k
  split: train
  condition_type: label
training:
  epochs: 84
  global_batch_size: 1024
  grad_accum_steps: 256
  ema_decay: 0.9995
  num_workers: 2
  log_interval: 20
  checkpoint_interval: 0
  sample_every: 0
  clip_grad: 1.0
  global_seed: 42
  optimizer:
    type: gmuon
    lr: 0.0002
    momentum: 0.95
    nesterov: true
    ns_coefficients_preset: POLAR_EXPRESS_COEFFICIENTS
    ns_use_kernels: false
    weight_decay: 0.0
  scheduler:
    type: linear
    warmup_epochs: 25
    decay_end_epoch: 50
    base_lr: 0.0002
    final_lr: 2.0e-05
    warmup_from_zero: false
  image_size: 256
misc:
  latent_size: [1024, 16, 16]
  num_classes: 1000
  time_dist_shift_dim: 262144
  time_dist_shift_base: 4096
